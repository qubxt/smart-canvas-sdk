<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explore · Smart Canvas</title>
    <meta
      name="description"
      content="Open any smart sketch, swap its texture, and record the result."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/src/site.css" />
  </head>

  <body class="bg-ink font-sans text-paper antialiased">
    <header
      class="fixed inset-x-0 top-0 z-20 border-b border-paper/10 bg-ink/70 backdrop-blur-md"
    >
      <nav
        class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3 sm:px-6"
      >
        <a href="/" class="font-display text-xl">Smart Canvas</a>
        <a
          href="#/"
          class="font-mono text-xs text-muted transition-colors hover:text-paper"
          >Explore</a
        >
      </nav>
    </header>

    <main id="outlet"></main>

    <template id="gallery-view">
      <div class="mx-auto max-w-6xl px-4 pt-28 pb-20 sm:px-6">
        <h1
          tabindex="-1"
          class="font-display text-5xl outline-none sm:text-6xl"
        >
          Explore the sketches
        </h1>
        <p class="mt-4 max-w-xl leading-relaxed text-muted">
          Open a sketch to swap its texture, pause it, and record what it does.
        </p>
        <ul
          data-slot="cards"
          class="mt-12 grid gap-x-6 gap-y-10 sm:grid-cols-2 lg:grid-cols-3"
        ></ul>
      </div>
    </template>

    <template id="sketch-card">
      <li>
        <a data-slot="link" class="group block">
          <div class="aspect-[4/3] overflow-hidden rounded-lg bg-ink-raised">
            <img
              data-slot="poster"
              alt=""
              loading="lazy"
              class="size-full object-cover transition-transform duration-500 group-hover:scale-105 motion-reduce:transition-none"
            />
          </div>
          <h2
            data-slot="title"
            class="mt-4 font-display text-2xl group-hover:text-ember"
          ></h2>
          <p data-slot="summary" class="mt-1 text-sm text-muted"></p>
        </a>
      </li>
    </template>

    <template id="sketch-view">
      <div class="mx-auto max-w-6xl px-4 pt-24 pb-16 sm:px-6">
        <a href="#/" class="font-mono text-xs text-ember hover:underline"
          >&larr; All sketches</a
        >
        <h1
          data-slot="title"
          tabindex="-1"
          class="mt-3 font-display text-5xl outline-none"
        ></h1>
        <p data-slot="summary" class="mt-2 text-muted"></p>

        <div class="mt-8 grid gap-6 lg:grid-cols-[minmax(0,1fr)_22rem]">
          <div class="min-w-0">
            <div
              data-slot="stage"
              class="relative aspect-[4/3] overflow-hidden rounded-lg bg-ink-raised"
            >
              <img
                data-slot="poster"
                alt=""
                class="absolute inset-0 size-full object-cover"
              />
            </div>

            <section
              aria-label="Playback"
              class="mt-4 flex flex-wrap items-center gap-2 font-mono text-xs"
            >
              <button
                data-slot="play"
                class="min-w-20 cursor-pointer rounded-full bg-paper px-4 py-2.5 font-medium text-ink transition-colors hover:bg-ember disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-paper"
              >
                Pause
              </button>
              <button
                data-slot="record"
                aria-pressed="false"
                class="group inline-flex cursor-pointer items-center gap-2 rounded-full border border-line px-4 py-2.5 transition-colors hover:border-paper/40 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:border-line aria-pressed:border-red-400 aria-pressed:text-red-300"
              >
                <span
                  aria-hidden="true"
                  class="size-2 rounded-full bg-red-400 group-aria-pressed:animate-pulse"
                ></span>
                <span data-slot="record-label">Record</span>
              </button>
              <button
                data-slot="download"
                class="cursor-pointer rounded-full border border-line px-4 py-2.5 transition-colors hover:border-paper/40 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:border-line"
              >
                Download
              </button>
              <p data-slot="download-hint" class="text-muted">
                Record a clip to download it.
              </p>
            </section>
          </div>

          <div class="min-w-0 space-y-6">
            <section aria-labelledby="texture-heading">
              <h2 id="texture-heading" class="font-mono text-xs text-muted">
                Canvas texture
              </h2>
              <div
                data-slot="presets"
                role="radiogroup"
                aria-labelledby="texture-heading"
                class="mt-3 grid grid-cols-5 gap-2"
              ></div>
              <label
                class="mt-3 flex cursor-pointer items-center gap-3 rounded-lg border border-dashed border-line px-3 py-2.5 font-mono text-xs transition-colors hover:border-paper/40 has-disabled:cursor-not-allowed has-disabled:opacity-40 has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-ember"
              >
                <span class="shrink-0">Upload an image</span>
                <span
                  data-slot="file-name"
                  class="min-w-0 truncate text-muted"
                ></span>
                <input
                  data-slot="file"
                  type="file"
                  accept="image/*"
                  class="sr-only"
                />
              </label>
            </section>

            <section aria-labelledby="log-heading">
              <h2 id="log-heading" class="font-mono text-xs text-muted">
                Lifecycle
              </h2>
              <ol
                data-slot="log"
                role="log"
                aria-labelledby="log-heading"
                tabindex="0"
                class="mt-3 h-64 overflow-y-auto rounded-lg border border-line bg-ink-raised p-3 font-mono text-xs leading-relaxed"
              ></ol>
            </section>
          </div>
        </div>
      </div>
    </template>

    <template id="texture-option">
      <label
        class="block aspect-square cursor-pointer overflow-hidden rounded-md border-2 border-transparent transition-colors hover:border-paper/40 has-checked:border-ember has-disabled:cursor-not-allowed has-disabled:opacity-40 has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-ember"
      >
        <input data-slot="input" type="radio" name="texture" class="sr-only" />
        <img data-slot="thumbnail" alt="" class="size-full object-cover" />
      </label>
    </template>

    <template id="not-found-view">
      <div class="mx-auto max-w-6xl px-4 pt-32 pb-20 sm:px-6">
        <h1 tabindex="-1" class="font-display text-5xl outline-none">
          No sketch here
        </h1>
        <p class="mt-4 text-muted">That link doesn’t match a sketch.</p>
        <a
          href="#/"
          class="mt-6 inline-block font-mono text-xs text-ember hover:underline"
          >&larr; All sketches</a
        >
      </div>
    </template>

    <script type="module" src="/src/explore/main.js"></script>
  </body>
</html>
