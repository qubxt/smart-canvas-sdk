name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Formatting and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The excluded vite-p5 folders hold work in progress that isn't formatted
      # yet. pnpm rewrites the lockfile in its own style on every install.
      - name: Check formatting
        run: >-
          pnpm exec prettier --check .
          '!pnpm-lock.yaml'
          '!apps/vite-p5/src/{classes,effects,sketches,utils}/**'
      - name: Test next-ffmpeg
        run: pnpm --filter next-ffmpeg test

  landing-page:
    name: Landing page (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter vite-p5...
      - name: Install Chromium
        run: pnpm --filter vite-p5 exec playwright install --with-deps --only-shell chromium
      - name: Run browser tests
        run: pnpm --filter vite-p5 test:e2e
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/vite-p5/playwright-report/
          retention-days: 7
